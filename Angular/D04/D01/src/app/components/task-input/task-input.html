<div class="task-input-container">
  <div class="task-form monolith-card">
    <h2 class="form-title">New Objective</h2>
    
    <div class="form-group">
      <input type="text" placeholder="Objective Title" class="auth-input">
    </div>

    <div class="form-group">
      <textarea placeholder="Objective Details" class="auth-input textarea-input"></textarea>
    </div>

    <div class="form-group">
      <div class="priority-selector">
        <button class="priority-btn">Low</button>
        <button class="priority-btn active">Medium</button>
        <button class="priority-btn">High</button>
      </div>
    </div>

    <div class="form-group">
      <input type="date" class="auth-input">
    </div>

    <button class="create-task-btn">
      Create Task <span class="arrow-icon">→</span>
    </button>
  </div>
</div>
