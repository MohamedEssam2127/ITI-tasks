<header class="header">
  <div class="brand">TaskCurator</div>
  <ul class="nav">
    <li>Home</li>
    <li>Tasks</li>
    <li>Profile</li>
  </ul>

  <div class="header-icons">
    @if (isFlameVisible) {
      <app-flame [streak]="counter" (streakCompleted)="completeCycle()"></app-flame>
    }

    <div class="timer-container">
      <p class="timer">{{timer}}</p>
    </div>

    <div class="avatar"></div>
  </div>
</header>
