<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ChatGPT Clone</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="style.css">
</head>
<body>
<div class="app-container">

  <header class="header">
    <div class="header-left">
      <div class="ai-logo">
        <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="10"/><path d="M9.09 9a3 3 0 0 1 5.83 1c0 2-3 3-3 3"/><path d="M12 17h.01"/></svg>
      </div>
      <div class="header-info">
        <span class="header-title">ChatGPT</span>
        <span class="header-status">Online</span>
      </div>
    </div>
    <button class="new-chat-btn" id="new-chat-btn">
      <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 5v14M5 12h14"/></svg>
      New Chat
    </button>
  </header>

  <main class="chat-container" id="chat-container">

    <div class="welcome-state" id="welcome-state">
      <div class="welcome-icon">
      </div>
      <h2 class="welcome-title">How can I help you today?</h2>
      <p class="welcome-sub">Ask me anything — I'm here to assist you.</p>
    </div>

  </main>

  <footer class="input-area">
    <div class="input-wrapper">
      <input type="text" id="message-input" placeholder="Type a message..." class="message-input" autocomplete="off">
      <button class="send-btn" id="send-btn" aria-label="Send message">
        <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><line x1="22" y1="2" x2="11" y2="13"/><polygon points="22 2 15 22 11 13 2 9 22 2"/></svg>
      </button>
    </div>
    <p class="input-hint">ChatGPT can make mistakes. Consider checking important information.</p>
  </footer>

</div>
<script src="app.js"></script>
</body>
</html>
