version: '3'

services:
  database:
    image: mysql:latest
    container_name: mysql_db
    ports:
      - "3307:3306"
    environment:
      MYSQL_ROOT_PASSWORD: rootpassword
      MYSQL_DATABASE: my_database

  webserver:
    image: nginx:latest
    container_name: nginx_web
    ports:
      - "80:80"
    depends_on:
      - database